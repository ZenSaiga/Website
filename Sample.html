        var z = x + y;
        var a = x - y;
        var epstein = x * y;
        var diddy = x / y;
        var billclinton = x % y;
        
        console.log(x + " + " + y + " = " + (x < y));
        console.log(x + " - " + y + " = " + (x > y));
        console.log(x + " * " + y + " = " + (x == y));
        console.log(x + " / " + y + " = " + (x >= y));
        console.log(x + " % " + y + " = " + (x <= y));

        console.log(z);
        console.log(a);
        console.log(epstein);
