<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Test</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6fa;
            margin: 0;
            padding: 2rem;
            color: #142e04;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

         .box h1 {
            font-size: 1.25rem;
            color: #065524;
            margin: 0 0 1rem 0;
            text-align: center;
        }

        .box {
            background-color: #e8f5e9;
            border: 2px solid #065524;
            padding: 1.5rem;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        #svg2 {
            background-color: #043e1a;
            border-radius: 6px;
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="box">
            <h1>Circle element</h1>
            <svg viewBox="0 0 200 200" style="border: 2px solid #ff6207; border-radius: 6px; background: #ffffff;">
                <circle cx="100" cy="100" r="70" stroke="#065524" stroke-width="5" fill="#a3d9a5" />
            </svg>
        </div>

   
        <div class="box">
            <h1>g element</h1>
            <svg viewBox="0 0 420 220">
                <defs>
                    <linearGradient id="gfgStr">
                        <stop offset="50%" stop-color="#065524" />
                        <stop offset="100%" stop-color="#ff6207" />
                    </linearGradient>
                </defs>
                <g fill="#ffffff" stroke="url(#gfgStr)" stroke-width="15" transform="translate(10, 10)">
                    <rect width="400" height="200" />
                    <rect width="200" height="200" />
                    <rect width="200" height="100" />
                </g>
            </svg>
        </div>

        <div class="box">
            <h1>Polygon element</h1>
            <svg id="svg2" viewBox="0 0 200 210">
                <polygon points="100,100 15,205 150,7 20,0" fill="#1e833e" stroke="#ff6207" stroke-width="2" />
            </svg>
        </div>

   
        <div class="box">
            <h1>Text element</h1>
            <svg viewBox="0 0 160 160" style="background: #ffffff; border-radius: 6px;">
                <text x="10" y="10" fill="#065524" font-weight="bold" transform="rotate(30 20, 40)">
                    LoveAndLightTv
                </text>
                <text x="40" y="40" fill="#c55c16" font-weight="bold" transform="rotate(90 10, 60)">
                    LionPizzaChicken
                </text>
            </svg>
        </div>

        <div class="box">
            <h1>Line element</h1>
            <svg viewBox="0 0 150 150" style="background: #ffffff; border-radius: 6px;">
                <line x1="10" y1="10" x2="130" y2="130" stroke="#065524" stroke-width="4" stroke-linecap="round" />
            </svg>
        </div>
    </div>

    <script src="script.js"></script>
 <a href="index.html">Home</a>
</body>

</html>
