<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabular Data</title>
    <script src="StudentScript.js" defer></script>
</head>
<style>
    table{
        width: 80;
        margin: 20px auto;
        border-collapse: collapse;
        font-family: Arial, sans-serif;

    }
    th,td{
        border: 2px solid black;
        padding: 20px;
        text-align: center;
    } 

    th {
        background-color: green;
    }

    tbody tr :nth-child(even){
    background-color: light rgb(231, 126, 28);
    } 
    tbody tr :nth-child(odd){
    background-color: rgb(224, 88, 35);
    } 
    img{
        width: 100px;
        height: auto;
    }
</style>
<body>
    <center>
     <table border="2">
        <!-- top part-->
        <thead>
            <tr>
                <th>LRN</th>
                <th>NAME</th>
                <th>AGE</th>
                <th>SECTION</th>
                <th>IMAGES</th>
            </tr>
        </thead>
        <!-- bottom part-->
        <tbody id="output">
        </tbody>
    </table>
         <a href = "index.html"> Home </a>
   
     </center>
</body>
</html>
