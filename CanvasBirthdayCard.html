<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Greeting Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background-color: #ffffff;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<canvas id="greetingCard" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('greetingCard');
    const ctx = canvas.getContext('2d');

    function drawFilledBox(x, y, width, height, fillColor) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + width, y);
        ctx.lineTo(x + width, y + height);
        ctx.lineTo(x, y + height);
        ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill();
    }

    function drawStrokedBox(x, y, width, height, strokeColor, lineWidth) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + width, y);
        ctx.lineTo(x + width, y + height);
        ctx.lineTo(x, y + height);
        ctx.closePath();
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = strokeColor;
        ctx.stroke();
    }
 
    drawFilledBox(0, 0, 800, 600, '#f0f9ff');

    function draw20BlueCircles() {
        for (let i = 0; i < 20; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const radius = Math.random() * 25 + 5;
            const hue = Math.floor(Math.random() * 40) + 195;
            const lightness = Math.floor(Math.random() * 50) + 35;
            ctx.fillStyle = "hsl(" + hue + ", 85%, " + lightness + "%)";

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }
    }
    draw20BlueCircles();

    drawStrokedBox(25, 25, 750, 550, '#0369a1', 6);
  
    drawFilledBox(38, 38, 724, 524, 'rgba(255, 255, 255, 0.85)');
  
    ctx.beginPath();
    ctx.moveTo(180, 75);
    ctx.lineTo(620, 75);
    ctx.lineTo(600, 105);
    ctx.lineTo(620, 135);
    ctx.lineTo(180, 135);
    ctx.lineTo(200, 105);
    ctx.closePath();
    ctx.fillStyle = '#0284c7';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#0c4a6e';
    ctx.stroke();
 
    ctx.beginPath();
    ctx.moveTo(310, 480);
    ctx.lineTo(490, 480);
    ctx.lineTo(465, 455);
    ctx.lineTo(335, 455);
    ctx.closePath();
    ctx.fillStyle = '#94a3b8';
    ctx.fill();
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.stroke();

    drawFilledBox(280, 380, 240, 75, '#fbcfe8');
    drawStrokedBox(280, 380, 240, 75, '#db2777', 3);

    
    drawFilledBox(315, 315, 170, 65, '#fef08a');
    drawStrokedBox(315, 315, 170, 65, '#ca8a04', 3);

    
    drawFilledBox(350, 260, 100, 55, '#bae6fd');
    drawStrokedBox(350, 260, 100, 55, '#0284c7', 3);

    
    ctx.fillStyle = '#f472b6';
    for (let x = 295; x <= 505; x += 30) {
        ctx.beginPath();
        ctx.arc(x, 380, 15, 0, Math.PI, false);
        ctx.closePath();
        ctx.fill();
    }

    
    drawFilledBox(393, 215, 14, 45, '#FFFFE0');
    drawStrokedBox(393, 215, 14, 45, '#ef4444', 2);

   
    ctx.beginPath();
    ctx.arc(400, 202, 8, 0, Math.PI, false);
    ctx.lineTo(400, 182);
    ctx.closePath();
    ctx.fillStyle = '#f97316';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(140, 240, 45, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = '#FFFFE0';
    ctx.fill();
    ctx.strokeStyle = '#991b1b';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(140, 285);
    ctx.lineTo(133, 295);
    ctx.lineTo(147, 295);
    ctx.closePath();
    ctx.fillStyle = '#ef4444';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(140, 295);
    ctx.lineTo(135, 350);
    ctx.lineTo(145, 410);
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(660, 240, 45, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = '#10b981';
    ctx.fill();
    ctx.strokeStyle = '#065f46';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(660, 285);
    ctx.lineTo(653, 295);
    ctx.lineTo(667, 295);
    ctx.closePath();
    ctx.fillStyle = '#FFFFE0';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(660, 295);
    ctx.lineTo(665, 350);
    ctx.lineTo(655, 410);
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('HAPPY BIRTHDAY DANIEL!', 400, 115);

    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 22px Segoe UI, sans-serif';
    ctx.fillText('Wishing you a year filled with joy & success!', 400, 528);
</script>

</body>
</html>
